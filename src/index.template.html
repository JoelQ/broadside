<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Broadside — Pirate Hunter</title>
<meta name="description" content="Age-of-sail ship combat in the browser: broadsides, wind, four kinds of shot, and boarding. Hunt five pirate captains.">
<meta property="og:title" content="Broadside — Pirate Hunter">
<meta property="og:description" content="Age-of-sail ship combat in the browser: broadsides, wind, four kinds of shot, and boarding.">
<meta property="og:image" content="https://joelq.github.io/broadside/title.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a1826'/%3E%3Cpath d='M15 4h2v20h-2z' fill='%23d7b25a'/%3E%3Cpath d='M17 6l9 14h-9zM14 9l-8 11h8z' fill='%23f3ead2'/%3E%3Cpath d='M5 23h22l-3 5H8z' fill='%23c5402f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{
  --brass:#d7b25a; --navy:rgba(9,18,30,.74); --line:rgba(215,178,90,.5); --red:#c5402f; --green:#7fce7a; --cream:#f3ead2; --bad:#ff9a8a;
  --head:'Pirata One','IM Fell English',Georgia,serif; --body:'IM Fell English',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1826;color:var(--cream);font-family:var(--body);user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:.74em;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);border-radius:4px;padding:0 5px;margin:0 1px;color:#fff}
.good{color:var(--green)} .bad{color:var(--bad)}
.btn{font:400 20px var(--head);letter-spacing:1px;background:rgba(9,18,30,.8);color:var(--cream);border:1px solid var(--line);border-radius:5px;padding:7px 18px;cursor:pointer}
.btn:hover{background:rgba(215,178,90,.25)} .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.38;cursor:default}
.btn.big{font-size:28px;padding:10px 38px;background:var(--red);border-color:#6d1a12;box-shadow:0 3px 0 #6d1a12}
.btn.big:hover{background:#d9503d}
.btn.sm{font:400 14px var(--body);letter-spacing:0;padding:4px 11px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.panel{position:absolute;background:var(--navy);border:1px solid var(--line);border-radius:8px;padding:8px 12px;backdrop-filter:blur(3px)}
.ship-panel{top:10px;width:min(250px,42vw)}
#pPanel{left:10px} #ePanel{right:10px}
.ship-panel h3{margin:0;font:400 20px/1.1 var(--head);letter-spacing:.5px;color:var(--brass);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ship-panel .sub{font-size:12px;opacity:.75;margin-bottom:5px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:grid;grid-template-columns:40px 1fr 30px;align-items:center;gap:6px;font-size:12px;margin:3px 0}
.bar .t{height:9px;background:rgba(0,0,0,.45);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.bar .t i{display:block;height:100%;width:100%;border-radius:5px;transition:width .25s}
.bar.hull i{background:linear-gradient(#d0864a,#9c5a2a)} .bar.sail i{background:linear-gradient(#f1e8cf,#c2b48a)} .bar.crew i{background:linear-gradient(#6fb1e6,#3b74b4)}
.bar b{font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
/* the share of a crew that is below decks, where guns cannot reach */
.bar.crew .t{position:relative} .bar.crew .t:after{content:'';position:absolute;left:0;top:0;bottom:0;width:30%;background:repeating-linear-gradient(135deg,rgba(0,0,0,.45) 0 3px,transparent 3px 6px);border-right:2px solid #fff}
.status{font-size:12px;color:#ffb36b} .gauge{font-size:12.5px} .status:empty,.gauge:empty{display:none}
#toasts{position:absolute;top:92px;left:50%;transform:translateX(-50%);width:min(560px,90vw);display:flex;flex-direction:column;align-items:center;gap:5px}
.toast{background:rgba(8,14,22,.78);border:1px solid var(--line);padding:4px 14px;border-radius:16px;font-size:15px;animation:tin .25s ease-out;transition:opacity .6s;text-align:center}
.toast.good{border-color:var(--green);color:#c9f5c4} .toast.bad{border-color:#e0685c;color:#ffc9c2} .toast.big{font:400 24px var(--head);letter-spacing:1px;color:#ffe29a}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

#dial{left:10px;bottom:10px;padding:6px 10px 6px 6px;display:flex;gap:10px;align-items:center}
#radar{width:176px;height:176px;display:block}
#sailInfo{font-size:13px;line-height:1.45;min-width:128px}
#sailInfo .big{font:400 26px/1 var(--head);color:var(--brass)}
#sailName{font:400 17px var(--head);letter-spacing:.5px}
#sailBars{display:flex;align-items:flex-end;gap:4px;height:44px;margin:4px 0 2px} #sailBars i{width:20px;background:rgba(255,255,255,.14);border-radius:2px 2px 0 0;border:1px solid rgba(255,255,255,.2)}
#sailBars i:nth-child(1){height:38%} #sailBars i:nth-child(2){height:68%} #sailBars i:nth-child(3){height:100%} #sailBars i.on{background:var(--cream);border-color:var(--cream)}
#pos{font:400 17px var(--head);min-height:20px}
#guns{left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:10px;align-items:stretch;padding:8px 10px;pointer-events:auto}
.battery{width:86px;text-align:center;font-size:11px;letter-spacing:1px;display:flex;flex-direction:column;justify-content:center;gap:4px;border-radius:6px;padding:3px;cursor:pointer}
.battery .g{height:12px;border-radius:6px;background:rgba(0,0,0,.5);overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.battery .g i{display:block;height:100%;width:0;background:var(--red)}
.battery.ready .g i{background:#5fae5a} .battery.bear{background:rgba(255,216,110,.2);box-shadow:0 0 0 1px #ffd86e inset}
.battery .s{font-size:11px;opacity:.85}
#ammo{display:flex;gap:6px}
.slot{width:62px;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:4px 2px;text-align:center;cursor:pointer;background:rgba(0,0,0,.25);position:relative}
.slot.sel{border-color:var(--brass);background:rgba(201,162,74,.22);box-shadow:0 0 10px rgba(201,162,74,.35)}
.slot.out{opacity:.38}
.slot svg,.item svg{width:26px;height:26px;display:block;margin:0 auto;flex:none}
.slot .n{font-size:12px} .slot .c{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.slot kbd{position:absolute;top:2px;left:2px;font-size:9px;padding:0 3px}
#ammoTip{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);white-space:nowrap;font-size:14px;font-style:italic;text-shadow:0 1px 4px #000,0 0 2px #000}
#coach{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);width:min(620px,92vw);background:rgba(8,14,22,.86);border:1px solid var(--brass);border-radius:8px;padding:9px 14px;font-size:17px;display:flex;gap:10px;align-items:center;pointer-events:auto;box-shadow:0 0 22px rgba(215,178,90,.25)}
#coach span{flex:1} #coach i{font-size:12px;opacity:.6;font-style:normal} #coach button{background:none;border:0;font-size:12px;opacity:.6;cursor:pointer;text-decoration:underline}
#boardGo{position:absolute;left:50%;bottom:200px;transform:translateX(-50%);pointer-events:auto;cursor:pointer;font:400 30px var(--head);letter-spacing:1px;color:#0b1a0b;background:#8dff86;border-radius:10px;padding:8px 26px;box-shadow:0 0 30px rgba(127,255,122,.7);animation:pulse .6s infinite alternate;text-align:center;white-space:nowrap;overflow:hidden}
#boardGo kbd{background:#0b1a0b;color:#8dff86;border-color:#0b1a0b;font-size:.7em} #boardGo small{display:block;font:italic 14px var(--body);letter-spacing:0}
#boardGo.warn{background:#ff8a78;box-shadow:0 0 30px rgba(255,120,100,.7);font-size:22px} #boardGo i{position:absolute;left:0;bottom:0;height:5px;background:#7a160c}
@keyframes pulse{to{transform:translateX(-50%) scale(1.05)}}
#help{right:10px;top:150px;font-size:12px;line-height:1.8;padding:4px 10px;opacity:.8;pointer-events:auto;cursor:pointer}
#help .all{display:none} #help.open .all{display:block} #help.open .tip{display:none}
#hud.m-melee #dial,#hud.m-melee #guns,#hud.m-melee #help,#hud.m-melee #touch,#hud.m-port #dial,#hud.m-port #guns,#hud.m-port #help,#hud.m-port #touch,#hud.m-port #ePanel{display:none!important}

#tag{position:fixed;left:0;top:0;pointer-events:none;text-align:center;font-size:12px;text-shadow:0 1px 3px #000;white-space:nowrap}
#tag .h{width:64px;height:5px;background:rgba(0,0,0,.55);border-radius:3px;overflow:hidden;margin:2px auto 0;border:1px solid rgba(255,255,255,.25)} #tag .h i{display:block;height:100%;background:#ff5b4a}
#tag .o{font:400 16px var(--head);letter-spacing:.5px;margin-top:2px} #tag .o:empty{display:none}
#tag .arrow{display:none;width:0;height:0;border:9px solid transparent;border-left:15px solid #ff5b4a;margin:0 auto 2px;transform-origin:50% 50%}
#tag.off .arrow{display:block} #tag.off .h{display:none}
#floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;left:0;top:0;font:400 19px var(--head);letter-spacing:.5px;white-space:nowrap;text-shadow:0 2px 4px #000,0 0 3px #000}
.fl.good{color:#ffe29a} .fl.bad{color:#ff8a78} .fl.rake{font-size:26px;color:#fff3c0}

#touch{position:absolute;inset:0;display:none}
body.touch #touch{display:block} body.touch #help{display:none} body.touch kbd{display:none}
.tb{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;background:rgba(10,20,32,.6);border:1px solid var(--line);color:var(--cream);font:400 15px var(--body);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1}
.tb:active,.tb.on{background:rgba(201,162,74,.45)}
body.touch #dial{bottom:auto;top:150px;transform:scale(.72);transform-origin:top left}
body.touch #guns{bottom:6px;transform:translateX(-50%) scale(.82);transform-origin:bottom center}
body.touch #coach{bottom:auto;top:130px;font-size:14px}

/* ---------- boarding ---------- */
#melee{position:fixed;inset:0;pointer-events:none}
#mStrip{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(640px,94vw);pointer-events:auto;padding:10px 14px;text-align:center}
#mStrip .vs{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
#mStrip .vs b{font:400 30px/1 var(--head);margin:0 6px} #mStrip .vs .l b{color:#8cc4f5} #mStrip .vs .r b{color:#ff7d6c}
#mStrip .how{font-size:17px;margin:6px 0 8px} #mStrip small{font-size:12px;opacity:.7;font-style:italic}
.tug{height:14px;background:#b8372b;border-radius:7px;overflow:hidden;margin-top:6px;border:1px solid rgba(255,255,255,.25)} .tug i{display:block;height:100%;width:50%;background:#3f86cc;transition:width .2s linear} #mStrip .acts{display:flex;gap:8px;justify-content:center}

/* ---------- port ---------- */
#port{position:fixed;inset:0;pointer-events:none}
#portTop{position:absolute;left:50%;top:10px;transform:translateX(-50%);text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#portTop .nm{font:400 34px/1 var(--head);letter-spacing:1px;color:#f6e3b0} #purse{font:400 26px var(--head);color:#ffd86e}
.spot{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;font:400 18px var(--head);letter-spacing:.5px;background:var(--navy);border:1px solid var(--line);border-radius:18px;padding:3px 14px;white-space:nowrap}
.spot:after{content:'';position:absolute;left:50%;top:100%;width:1px;height:16px;background:var(--line)}
.spot:hover,.spot.sel{background:rgba(215,178,90,.4);border-color:#ffe29a}
.spot i{display:none;position:absolute;right:-5px;top:-5px;width:13px;height:13px;border-radius:50%;background:var(--red);border:1px solid #fff}
.spot.need i{display:block}
#shop{left:10px;top:150px;width:300px;pointer-events:auto}
#shop h3{margin:0 0 6px;font:400 24px var(--head);color:var(--brass);display:flex;justify-content:space-between}
#shop .role{font-size:14px;font-style:italic;opacity:.85;margin:4px 0 8px}
.cmp{display:grid;grid-template-columns:52px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:5px 0} .cmp .t{position:relative;height:11px;background:rgba(0,0,0,.45);border-radius:6px} .cmp .t i{display:block;height:100%;background:var(--brass);border-radius:6px} .cmp .t u,.mk{position:absolute;top:-3px;width:3px;height:17px;background:#fff;border-radius:2px} .mk{position:static;display:inline-block;height:11px;vertical-align:-1px}
.spot.ship{background:rgba(31,70,120,.8);border-color:#8cc4f5}
#shop .x{background:none;border:0;cursor:pointer;font-size:16px;opacity:.7}
.item{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.12);font-size:15px}
.item .d{flex:1;line-height:1.2} .item .d small{display:block;opacity:.7;font-size:12.5px}
.lv i{display:inline-block;width:8px;height:8px;border-radius:50%;border:1px solid var(--cream);margin-right:2px} .lv i.on{background:var(--cream)}
#portGo{position:absolute;right:14px;bottom:14px;text-align:right;pointer-events:auto;text-shadow:0 2px 8px rgba(0,0,0,.8)}
#nextLine{font-size:15px;margin-bottom:8px;line-height:1.25}

/* ---------- screens ---------- */
#bars:before,#bars:after{content:'';position:fixed;left:0;right:0;height:0;background:#05090f;transition:height .5s;pointer-events:none}
#bars:before{top:0} #bars:after{bottom:0} #bars.on:before,#bars.on:after{height:9vh}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(5,10,18,.72);text-align:center}
#screen.clear{background:radial-gradient(ellipse at center,rgba(5,10,18,.42),rgba(5,10,18,0) 70%)}
#screen.low{align-items:flex-end;justify-content:flex-start;text-align:left;padding:0 6vw 13vh;background:linear-gradient(transparent 45%,rgba(5,10,18,.75))}
#screen h1{font:400 clamp(44px,8vw,84px)/.95 var(--head);margin:4px 0;letter-spacing:2px;color:#f6e3b0;text-shadow:0 3px 18px rgba(0,0,0,.8)}
.eyebrow{font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--brass);text-shadow:0 1px 4px #000}
#titleWrap h1{font-size:clamp(64px,14vw,136px)}
#titleWrap .tag{font-size:clamp(16px,2.6vw,22px);font-style:italic;margin:8px 0 26px;text-shadow:0 2px 8px #000}
.lower .line{font-size:18px;text-shadow:0 1px 4px #000} .lower .hook{font:italic 22px var(--body);margin:6px 0 16px;color:#ffe29a;text-shadow:0 1px 4px #000}
.banner .gold{font:400 46px var(--head);color:#ffd86e;text-shadow:0 2px 10px #000}
.banner .loot{font-size:16px;font-style:italic;opacity:.9;text-shadow:0 1px 4px #000}
.banner.bad h1{color:#ff9a8a}
.rowc{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:20px;flex-wrap:wrap}
.stats{display:flex;gap:22px;justify-content:center;margin-top:10px;font-size:14px;flex-wrap:wrap} .stats b{display:block;font:400 30px var(--head);color:#ffd86e}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:5px 26px;font-size:16px;text-align:left;margin:14px auto 0;width:min(560px,92vw)}

@media (max-width:700px){
  body.touch .tb{margin-bottom:92px}
  body.touch #guns{transform:translateX(-50%) scale(.74)}
  #toasts{top:150px} body.touch #toasts{top:272px} .toast{font-size:13px} .toast.big{font-size:19px}
  .bar{grid-template-columns:34px 1fr 26px;font-size:11px} .ship-panel h3{font-size:16px} .slot{width:54px}
  #shop{left:10px;right:10px;width:auto;top:auto;bottom:120px} .keys{grid-template-columns:1fr}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bars"></div>

<div id="hud" class="hidden">
  <div id="pPanel" class="panel ship-panel">
    <h3 id="pName"></h3><div class="sub" id="pSub"></div>
    <div class="bar hull"><span>Hull</span><div class="t"><i id="pHull"></i></div><b id="pHullN"></b></div>
    <div class="bar sail"><span>Sails</span><div class="t"><i id="pSail"></i></div><b id="pSailN"></b></div>
    <div class="bar crew"><span>Crew</span><div class="t"><i id="pCrew"></i></div><b id="pCrewN"></b></div>
    <div class="status" id="pStatus"></div>
  </div>
  <div id="ePanel" class="panel ship-panel">
    <h3 id="eName"></h3><div class="sub" id="eSub"></div>
    <div class="bar hull"><span>Hull</span><div class="t"><i id="eHull"></i></div><b id="eHullN"></b></div>
    <div class="bar sail"><span>Sails</span><div class="t"><i id="eSail"></i></div><b id="eSailN"></b></div>
    <div class="bar crew"><span>Crew</span><div class="t"><i id="eCrew"></i></div><b id="eCrewN"></b></div>
    <div class="status" id="eStatus"></div>
  </div>
  <div id="toasts"></div>
  <div id="dial" class="panel">
    <canvas id="radar" width="300" height="300"></canvas>
    <div id="sailInfo">
      <div><span class="big" id="knots">0</span> kn</div>
      <div id="sailBars"><i></i><i></i><i></i></div>
      <div id="sailName">Full sail</div>
      <div id="pos" class="bad"></div>
    </div>
  </div>
  <div id="coach" class="hidden"></div>
  <div id="guns" class="panel">
    <div id="ammoTip"></div>
    <div class="battery" id="bPort" data-fire="port"><div>◀ PORT <kbd>Q</kbd></div><div class="g"><i></i></div><div class="s"></div></div>
    <div id="ammo"></div>
    <div class="battery" id="bStbd" data-fire="stbd"><div>STBD <kbd>E</kbd> ▶</div><div class="g"><i></i></div><div class="s"></div></div>
  </div>
  <div id="help" class="panel" data-tapkey="h">
    <div class="tip"><kbd>H</kbd> keys</div>
    <div class="all"><kbd>A</kbd><kbd>D</kbd> rudder · <kbd>W</kbd><kbd>S</kbd> sail<br><kbd>Space</kbd> fire · <kbd>Q</kbd><kbd>E</kbd> one side<br><kbd>1</kbd>–<kbd>4</kbd> shot · <kbd>B</kbd> board inside her ring<br><kbd>V</kbd> camera · <kbd>P</kbd> pause · <kbd>M</kbd> mute</div>
  </div>
  <div id="boardGo" class="hidden" data-tapkey="b"></div>
  <div id="touch">
    <div class="tb" data-key="a" style="left:14px;bottom:20px">◀</div>
    <div class="tb" data-key="d" style="left:84px;bottom:20px">▶</div>
    <div class="tb" data-tap="w" style="left:14px;bottom:90px">Sail +</div>
    <div class="tb" data-tap="s" style="left:84px;bottom:90px">Sail −</div>
    <div class="tb" data-tap="v" style="right:14px;bottom:90px">Cam</div>
    <div class="tb" data-tap=" " style="right:14px;bottom:20px;width:72px;height:64px;border-radius:14px;background:rgba(184,55,43,.7)">FIRE</div>
  </div>
</div>

<div id="tag" class="hidden"><div class="arrow"></div><span class="d"></span><div class="h"><i></i></div><div class="o"></div></div>
<div id="floaters"></div>

<div id="melee" class="hidden">
  <div id="mStrip" class="panel">
    <div class="vs"><span class="l"><span id="mPN"></span><b id="mPC"></b><small id="mPL"></small></span><span class="r"><small id="mEL"></small><b id="mEC"></b><span id="mEN"></span></span></div>
    <div class="tug"><i id="mBar"></i></div>
    <div class="how" id="mState"></div>
    <div class="acts"><button class="btn sm" id="mSwivel" data-tapkey="f"><kbd>F</kbd> Swivel gun: spend 1 grape, kill about 8 <span></span></button><button class="btn sm" data-tapkey="x"><kbd>X</kbd> Cut the grapples (lose 1 in 10)</button></div>
  </div>
</div>

<div id="port" class="hidden">
  <div id="portTop"><div class="eyebrow">Home port</div><div class="nm">Port Halcyon</div><div id="purse"></div></div>
  <div id="spots"></div>
  <div id="shop" class="panel hidden"></div>
  <div id="portGo"><div id="nextLine"></div><button class="btn big" data-act="sail">Put to sea</button></div>
</div>

<div id="screen" class="hidden"></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
