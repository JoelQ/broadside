# Checks every pull request: the maps, the whole campaign, screenshots, and what the change does to balance.
# Results are in each job's summary and its artifacts. Map errors, a page error or a campaign that can't
# be finished fail the run; the balance job only reports.
name: Checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: Fights per balance cell (each on its own seed)
        default: '1'
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  SEED: '1000'

jobs:
  maps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Draw and check every leg
        run: |
          set -o pipefail
          npm run --silent map -- --quiet | tee map.txt
          { echo '### Map checks'; echo '```'; cat map.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: maps, path: out/maps }

  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run build
      - name: Play the whole campaign for both sides
        run: node tools/balance/drive.mjs tools/balance/flow.mjs
      - name: Screenshots at desktop and phone sizes
        run: node tools/shots/shots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: out/shots }

  balance:
    runs-on: ubuntu-latest
    env:
      RUNS: ${{ inputs.runs || '1' }}
      BASE: ${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Build this branch and the branch it merges into
        run: |
          npm run build
          git worktree add ../base "origin/$BASE"
          (cd ../base && npm ci && npm run build)
      # both builds play the same jobs on the same seeds, so a fight that changed outcome changed because of the rules
      - name: Play every campaign leg on both builds
        run: |
          node tools/balance/run.mjs tools/balance/legs.mjs "$RUNS" after.json > after.txt
          DIST=../base/dist/index.html node tools/balance/run.mjs tools/balance/legs.mjs "$RUNS" before.json > before.txt || echo 'the base build could not be played' > before.txt
      - name: Report
        if: always()
        run: |
          {
            echo "### Balance: this branch against $BASE (seed $SEED, $RUNS per cell)"
            echo '```'
            if [ -s before.json ]; then node tools/balance/compare.mjs before.json after.json 1; else cat before.txt; fi
            echo '```'
            echo '#### The three-ways rule on this branch'
            echo '```'
            node tools/balance/legreport.mjs after.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: balance, path: '*.json' }
